{% extends "base.html" %}
{% block title %}Status — Vaction{% endblock %}
{% block content %}
<h1>Status</h1>
<p class="subtitle">Overview of all indexed content</p>

<div id="statusContent">
    <div class="card"><p style="color:#666;">Loading...</p></div>
</div>
{% endblock %}

{% block scripts %}
<script>
fetch('/api/status').then(r=>r.json()).then(data=>{
    const el = document.getElementById('statusContent');

    if (!data.series.length) {
        el.innerHTML = '<div class="card"><p style="color:#666;">No data yet. <a href="/add-videos" style="color:#4a9eff;">Add some videos</a> to get started.</p></div>';
        return;
    }

    let html = '';
    data.series.forEach(s => {
        html += `<div class="card">
            <h2>${s.name}</h2>
            <p style="color:#666; font-size:13px; margin-bottom:16px;">${s.path}</p>
            <div class="grid-2" style="margin-bottom:20px;">
                <div><div class="stat-value">${s.total_episodes}</div><div class="stat-label">Episodes</div></div>
                <div><div class="stat-value">${s.total_frames.toLocaleString()}</div><div class="stat-label">Frames</div></div>
                <div><div class="stat-value">${s.total_detections.toLocaleString()}</div><div class="stat-label">Detections</div></div>
                <div><div class="stat-value">${s.total_detections > 0 && s.total_frames > 0 ? (s.total_detections / s.total_frames).toFixed(1) : '0'}</div><div class="stat-label">Avg Detections/Frame</div></div>
            </div>`;

        if (s.episodes.length) {
            html += `<table>
                <thead>
                    <tr>
                        <th>Episode</th>
                        <th>Title</th>
                        <th>Resolution</th>
                        <th style="text-align:right;">Duration</th>
                        <th style="text-align:right;">Frames</th>
                        <th style="text-align:right;">Detections</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>`;
            s.episodes.forEach(ep => {
                const dur = ep.duration ? formatDuration(ep.duration) : '-';
                const status = ep.detections > 0
                    ? '<span class="tag" style="background:#1a3a1a; color:#51cf66;">Detected</span>'
                    : ep.frames > 0
                        ? '<span class="tag" style="background:#3a3a1a; color:#ffd43b;">Sampled</span>'
                        : '<span class="tag">Registered</span>';
                html += `<tr>
                    <td><strong>S${String(ep.season).padStart(2,'0')}E${String(ep.episode).padStart(2,'0')}</strong></td>
                    <td>${ep.title || ''}</td>
                    <td style="color:#888;">${ep.resolution || ''}</td>
                    <td style="text-align:right; color:#888;">${dur}</td>
                    <td style="text-align:right;">${ep.frames.toLocaleString()}</td>
                    <td style="text-align:right;">${ep.detections.toLocaleString()}</td>
                    <td>${status}</td>
                </tr>`;
            });
            html += '</tbody></table>';
        }

        html += '</div>';
    });

    el.innerHTML = html;
});

function formatDuration(secs) {
    const m = Math.floor(secs / 60);
    const s = Math.floor(secs % 60);
    return m + ':' + String(s).padStart(2, '0');
}
</script>
{% endblock %}

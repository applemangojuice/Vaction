<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vaction{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.32.0/plotly.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
            background: #000;
            color: #f5f5f7;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        /* ── Navigation ── */
        nav {
            background: rgba(22, 22, 23, 0.8);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding: 0 32px;
            display: flex;
            align-items: center;
            height: 52px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav .logo {
            font-weight: 600;
            font-size: 20px;
            color: #f5f5f7;
            margin-right: 40px;
            letter-spacing: -0.5px;
        }
        nav a {
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            letter-spacing: -0.1px;
        }
        nav a:hover {
            color: rgba(255,255,255,0.8);
        }
        nav a.active {
            color: #fff;
            background: rgba(255,255,255,0.1);
        }
        /* ── Layout ── */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px;
        }
        .container-wide {
            max-width: 1440px;
            margin: 0 auto;
            padding: 32px 24px;
        }
        h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
            color: #f5f5f7;
        }
        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #f5f5f7;
            letter-spacing: -0.3px;
        }
        h3 {
            font-size: 15px;
            font-weight: 600;
            color: rgba(255,255,255,0.6);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        .subtitle {
            color: rgba(255,255,255,0.4);
            font-size: 15px;
            margin-bottom: 28px;
            letter-spacing: -0.1px;
        }
        /* ── Cards ── */
        .card {
            background: rgba(28,28,30,0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
        }
        .card-flat {
            background: rgba(28,28,30,0.4);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
        }
        /* ── Forms ── */
        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: rgba(255,255,255,0.4);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #f5f5f7;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #0a84ff;
            box-shadow: 0 0 0 3px rgba(10,132,255,0.15);
        }
        textarea { resize: vertical; min-height: 60px; }
        /* ── Buttons ── */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 20px;
            background: #0a84ff;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            letter-spacing: -0.1px;
        }
        .btn:hover { background: #0070e0; transform: scale(1.01); }
        .btn:active { transform: scale(0.99); }
        .btn:disabled { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.25); cursor: not-allowed; transform: none; }
        .btn-secondary {
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.8);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.12); }
        .btn-sm { padding: 6px 14px; font-size: 13px; border-radius: 8px; }
        .btn-danger { background: #ff453a; }
        .btn-danger:hover { background: #e03e35; }
        .btn-green { background: #30d158; color: #000; }
        .btn-green:hover { background: #28b84c; }
        /* ── Log ── */
        .log {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 16px;
            font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            max-height: 280px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.7;
        }
        .log .error { color: #ff453a; }
        .log .info { color: #0a84ff; }
        /* ── Progress ── */
        .progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.06);
            border-radius: 2px;
            overflow: hidden;
            margin: 8px 0;
        }
        .progress-bar .fill {
            height: 100%;
            background: #0a84ff;
            border-radius: 2px;
            transition: width 0.4s ease;
            width: 0%;
        }
        .progress-bar-lg { height: 6px; border-radius: 3px; }
        .progress-bar-lg .fill { border-radius: 3px; }
        /* ── Tables ── */
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th {
            text-align: left;
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-weight: 500;
            color: rgba(255,255,255,0.4);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.8);
        }
        tr:hover td { background: rgba(255,255,255,0.03); }
        /* ── Tags & Pills ── */
        .tag {
            display: inline-block;
            padding: 3px 10px;
            background: rgba(10,132,255,0.12);
            color: #0a84ff;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
        }
        .tag-green { background: rgba(48,209,88,0.12); color: #30d158; }
        .tag-purple { background: rgba(191,90,242,0.12); color: #bf5af2; }
        .tag-orange { background: rgba(255,159,10,0.12); color: #ff9f0a; }
        .pill-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 12px;
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.7);
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid transparent;
        }
        .pill:hover { background: rgba(255,255,255,0.1); }
        .pill.active { background: rgba(10,132,255,0.15); color: #0a84ff; border-color: rgba(10,132,255,0.3); }
        .pill .remove { cursor: pointer; opacity: 0.4; margin-left: 2px; }
        .pill .remove:hover { opacity: 1; }
        /* ── Grid & Layout ── */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .row { display: flex; gap: 12px; align-items: flex-end; }
        .row .form-group { flex: 1; margin-bottom: 0; }
        .flex { display: flex; }
        .flex-col { display: flex; flex-direction: column; }
        .gap-8 { gap: 8px; }
        .gap-16 { gap: 16px; }
        .gap-24 { gap: 24px; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .mt-8 { margin-top: 8px; }
        .mt-16 { margin-top: 16px; }
        .mt-24 { margin-top: 24px; }
        .mb-8 { margin-bottom: 8px; }
        .mb-16 { margin-bottom: 16px; }
        .mb-24 { margin-bottom: 24px; }
        /* ── Stats ── */
        .stat-value {
            font-size: 32px;
            font-weight: 600;
            color: #f5f5f7;
            letter-spacing: -1px;
        }
        .stat-label {
            font-size: 12px;
            color: rgba(255,255,255,0.35);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
        /* ── Charts ── */
        .chart-container {
            position: relative;
            min-height: 400px;
            margin-top: 16px;
        }
        /* ── Tabs ── */
        .tab-bar {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 24px;
        }
        .tab-bar button {
            background: none;
            border: none;
            padding: 10px 18px;
            color: rgba(255,255,255,0.4);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-family: inherit;
            transition: all 0.15s;
            margin-bottom: -1px;
        }
        .tab-bar button:hover { color: rgba(255,255,255,0.7); }
        .tab-bar button.active {
            color: #0a84ff;
            border-bottom-color: #0a84ff;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        /* ── Segmented control ── */
        .segmented {
            display: inline-flex;
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 3px;
            gap: 2px;
        }
        .segmented button {
            background: none;
            border: none;
            padding: 6px 16px;
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            font-family: inherit;
            transition: all 0.15s;
        }
        .segmented button:hover { color: rgba(255,255,255,0.7); }
        .segmented button.active {
            background: rgba(255,255,255,0.12);
            color: #fff;
        }
        /* ── Modal ── */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.visible { display: flex; }
        .modal {
            background: #1c1c1e;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 28px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }
        /* ── Misc ── */
        .hidden { display: none !important; }
        .text-muted { color: rgba(255,255,255,0.35); }
        .text-sm { font-size: 13px; }
        .text-xs { font-size: 11px; }
        .text-center { text-align: center; }
        .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .clickable { cursor: pointer; }
        .clickable:hover { opacity: 0.85; }
        ::selection { background: rgba(10,132,255,0.3); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
        /* Drilldown panel */
        .drilldown-panel {
            position: fixed;
            top: 0; right: 0; bottom: 0;
            width: 480px;
            background: #1c1c1e;
            border-left: 1px solid rgba(255,255,255,0.08);
            z-index: 150;
            overflow-y: auto;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            padding: 24px;
        }
        .drilldown-panel.open { transform: translateX(0); }
        .drilldown-panel .close-btn {
            position: absolute; top: 16px; right: 16px;
            background: rgba(255,255,255,0.1);
            border: none; color: #fff; width: 32px; height: 32px;
            border-radius: 50%; cursor: pointer; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
        }
        @media (max-width: 768px) {
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
            .drilldown-panel { width: 100%; }
            nav { padding: 0 16px; }
        }
    </style>
</head>
<body>
    <nav>
        <span class="logo">Vaction</span>
        <a href="/" {% if request.path == '/' %}class="active"{% endif %}>Home</a>
        <a href="/content" {% if request.path in ('/content', '/add-videos', '/detect', '/processing') %}class="active"{% endif %}>Content</a>
        <a href="/analysis" {% if request.path in ('/analysis', '/search', '/charts', '/insights', '/explorer') %}class="active"{% endif %}>Analysis</a>
        <a href="/settings" {% if request.path in ('/settings', '/vocabulary', '/themes', '/faces', '/status') %}class="active"{% endif %}>Settings</a>
    </nav>
    <!-- Global job status bar -->
    <div id="globalJobBar" style="display:none; background:rgba(22,22,23,0.9); backdrop-filter:blur(10px); border-bottom:1px solid rgba(255,255,255,0.06); padding:0;"></div>
    {% block container %}
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% endblock %}
    {% block scripts %}{% endblock %}
    <script>
    (function(){
        const JOB_LABELS = {ingest: 'Ingesting', detect: 'Detecting', facescan: 'Face Scan'};
        const JOB_COLORS = {ingest: '#30d158', detect: '#0a84ff', facescan: '#bf5af2'};
        const bar = document.getElementById('globalJobBar');

        function pollJobs() {
            fetch('/api/jobs/active').then(r=>r.json()).then(data=>{
                const running = data.jobs.filter(j => !j.status || j.status === 'running');
                if (running.length === 0) {
                    bar.style.display = 'none';
                    bar.innerHTML = '';
                    return;
                }
                bar.style.display = 'block';
                let html = '';
                running.forEach(j => {
                    const label = JOB_LABELS[j.type] || j.type;
                    const color = JOB_COLORS[j.type] || '#0a84ff';
                    const pct = j.progress && j.progress.pct ? j.progress.pct : 0;
                    const series = j.series ? ` \u2014 ${j.series}` : '';
                    let detail = j.last_status || '';
                    if (j.progress && j.progress.processed && j.progress.total) {
                        detail = `${j.progress.processed}/${j.progress.total} frames`;
                        if (j.progress.detections !== undefined) detail += ` \u00b7 ${j.progress.detections} detections`;
                    }
                    html += `<div style="display:flex;align-items:center;gap:12px;padding:8px 32px;">
                        <span style="font-weight:600;color:${color};font-size:12px;min-width:80px;">${label}${series}</span>
                        <div style="flex:1;height:3px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;max-width:360px;">
                            <div style="width:${pct}%;height:100%;background:${color};border-radius:2px;transition:width 0.5s;"></div>
                        </div>
                        <span style="min-width:36px;text-align:right;color:rgba(255,255,255,0.5);font-size:12px;font-weight:500;">${pct}%</span>
                        <span style="color:rgba(255,255,255,0.3);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px;">${detail}</span>
                    </div>`;
                });
                bar.innerHTML = html;
            }).catch(()=>{});
        }
        pollJobs();
        setInterval(pollJobs, 2000);
    })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vaction{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
        }
        nav {
            background: #141414;
            border-bottom: 1px solid #2a2a2a;
            padding: 0 24px;
            display: flex;
            align-items: center;
            height: 56px;
            gap: 8px;
        }
        nav .logo {
            font-weight: 700;
            font-size: 18px;
            color: #fff;
            margin-right: 24px;
            letter-spacing: -0.5px;
        }
        nav a {
            color: #888;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.15s;
        }
        nav a:hover, nav a.active {
            color: #fff;
            background: #222;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 24px;
        }
        h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
        h2 { font-size: 18px; font-weight: 600; margin-bottom: 12px; color: #ccc; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }
        .card {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 10px 14px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            font-family: inherit;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #4a9eff;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s;
        }
        .btn:hover { background: #1565c0; }
        .btn:disabled { background: #333; color: #666; cursor: not-allowed; }
        .btn-secondary {
            background: #222;
            color: #ccc;
        }
        .btn-secondary:hover { background: #333; }
        .log {
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 16px;
            font-family: 'SF Mono', 'Menlo', monospace;
            font-size: 13px;
            color: #8b8;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.6;
        }
        .log .error { color: #e55; }
        .log .info { color: #8bf; }
        .progress-bar {
            height: 6px;
            background: #222;
            border-radius: 3px;
            overflow: hidden;
            margin: 12px 0;
        }
        .progress-bar .fill {
            height: 100%;
            background: #1a73e8;
            border-radius: 3px;
            transition: width 0.3s;
            width: 0%;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 2px solid #2a2a2a;
            font-weight: 600;
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #1a1a1a;
        }
        tr:hover td { background: #1a1a1a; }
        .tag {
            display: inline-block;
            padding: 2px 8px;
            background: #1a2a3a;
            color: #4a9eff;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
        .row { display: flex; gap: 12px; align-items: flex-end; }
        .row .form-group { flex: 1; margin-bottom: 0; }
        .chart-container {
            position: relative;
            height: 350px;
            margin-top: 16px;
        }
        .pill-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: #1a2a3a;
            color: #4a9eff;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
        }
        .pill:hover { background: #2a3a4a; }
        .pill .remove { cursor: pointer; opacity: 0.6; }
        .pill .remove:hover { opacity: 1; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <nav>
        <span class="logo">Vaction</span>
        <a href="/" {% if request.path == '/' %}class="active"{% endif %}>Home</a>
        <a href="/add-videos" {% if request.path == '/add-videos' %}class="active"{% endif %}>Add Videos</a>
        <a href="/detect" {% if request.path == '/detect' %}class="active"{% endif %}>Run Detection</a>
        <a href="/search" {% if request.path == '/search' %}class="active"{% endif %}>Search & Charts</a>
        <a href="/status" {% if request.path == '/status' %}class="active"{% endif %}>Status</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
